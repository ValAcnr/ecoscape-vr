# Runs behind the Traefik already on the VPS (network n8n_default, certresolver mytlschallenge).
# Deploy / update:  cd /root/ecoscape-vr && git pull && docker compose -f deploy/docker-compose.yml up -d --build
services:
  ecoscape:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ecoscape
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.ecoscape.rule=Host(`${ECOSCAPE_HOST:-ecoscape.srv1740888.hstgr.cloud}`)
      - traefik.http.routers.ecoscape.entrypoints=web,websecure
      - traefik.http.routers.ecoscape.tls=true
      - traefik.http.routers.ecoscape.tls.certresolver=mytlschallenge
      - traefik.http.services.ecoscape.loadbalancer.server.port=80
    networks: [n8n_default]
networks:
  n8n_default:
    external: true
